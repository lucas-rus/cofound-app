# Production profile settings for Render (PostgreSQL)
server.port=${PORT:8080}
server.address=0.0.0.0

# Database connection details (will be provided by Render environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable H2 console in production
spring.h2.console.enabled=false

# Keep ddl-auto as update for now, but in production, usually 'validate' or 'none' is preferred
spring.jpa.hibernate.ddl-auto=update

# Ensure mail properties are consistent
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:missing_user}
spring.mail.password=${SPRING_MAIL_PASSWORD:missing_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Secret
jwt.secret=${JWT_SECRET}



# File Uploads (use a temporary directory on Render)
file.upload-dir=/tmp/uploads
