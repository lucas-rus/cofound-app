# Copy this file to application.properties and fill in real values.

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/cofound_db?serverTimezone=UTC
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# Spring Data JPA (Hibernate) Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# JWT secret key
jwt.secret=REPLACE_WITH_RANDOM_LONG_SECRET

# Mail settings (Gmail example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_APP_EMAIL@gmail.com
spring.mail.password=YOUR_APP_EMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application base URL (for verification links)
app.url=http://localhost:8080

# File Upload Limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

